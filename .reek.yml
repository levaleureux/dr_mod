---
# Reek configuration for dr_mod
# See doc/reek_choices.md for rationale behind each choice.

### Generic smell configuration

detectors:
  IrresponsibleModule:
    enabled: false

  # Disabled: redundant with rubocop Metrics/ClassLength (max 100)
  # and Sandi Metz 5-line methods rule.
  TooManyMethods:
    enabled: false

  # Disabled: attr_gtk and attr_reader/attr_accessor are standard
  # DragonRuby patterns for component communication.
  Attribute:
    enabled: false

  # Adjusted: game components need more ivars than typical classes.
  TooManyInstanceVariables:
    max_instance_variables: 8

  NestedIterators:
    exclude:
      - "MyWorker#self.class_method"
      - "AnotherWorker#instance_method"

  DataClump:
    max_copies:      3
    min_clump_size:  3

### Directory specific configuration

directories:
  "spec":
    UtilityFunction:
      enabled: false

  "lib":
    InstanceVariableAssumption:
      enabled: false

  # DragonRuby's attr_gtk injects ivars at runtime.
  # Extracted modules rely on parent class ivars by design.
  "app":
    InstanceVariableAssumption:
      enabled: false

### Excluding directories

exclude_paths:
  - lib/legacy
  - lib/rake/legacy_tasks
  - lib/smelly.rb
  - lib/dr_mod_tracker/misc  # scratchpad files, see #16
  - db/migrate
  - config
  # - spec
