AllCops:
  TargetRubyVersion: 2.6
  Exclude:
      - 'spec/controllers/**/*'
      - 'spec/features/**/*'
      - 'spec/models/**/*'
      - 'spec/i18n_spec.rb'
      - 'spec/payloads/**/*'
      - 'db/**/*'
      - 'config/**/*'
      - 'lib/dr_mod_tracker/misc/**/*'  # scratchpad files, see #16
  DisabledByDefault: true

